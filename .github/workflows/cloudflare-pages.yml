name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validate:
    name: Unit, UAT, and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check required files
        run: |
          test -f index.html
          test -f image-converter.html
          test -f calculator.html
          test -f unit-converter.html
          test -f metadata-lab.html
          test -f base64-converter.html
          test -f file-diff.html
          test -f word-count.html
          test -f text-transfer.html
          test -f rot-cipher.html
          test -f lan-chat.html
          test -f image-editor.html
          test -f pdf-merge.html
          test -f images-to-pdf.html
          test -f toolkit.js
          test -f toolkit.css
          test -f vendor/diff.min.js
          test -f vendor/fabric.min.mjs
          test -f vendor/pdf-lib.min.js
          test -f tests/browser-smoke.html
          test -f scripts/build-offline.mjs
          test -f scripts/verify-offline.mjs
          test -x serve-local.sh
      - name: Build and verify offline downloads
        run: |
          node scripts/build-offline.mjs
          cp offline/manifest.json /tmp/offline-manifest.json
          node scripts/build-offline.mjs
          cmp /tmp/offline-manifest.json offline/manifest.json
          node scripts/verify-offline.mjs
          git diff --exit-code -- offline
      - name: Verify strict hosted sources
        run: node scripts/verify-hosted.mjs
      - name: Check hosted JavaScript syntax
        run: |
          for file in toolkit.js assets/pages/*.js; do
            node --check "$file"
          done
      - name: Run browser unit and UAT coverage
        env:
          UAT_TIMEOUT_MS: "90000"
        run: node scripts/run-browser-uat.mjs
      - name: Enforce complete maintained-source coverage
        run: node scripts/verify-coverage.mjs
      - name: Verify SonarQube input reports
        run: |
          test -s build/reports/browser-uat/lcov.info
          test -s build/reports/browser-uat/sonar-test-execution.xml
          test -s build/reports/browser-uat/coverage-gate.json
      - name: Require SonarQube Cloud token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-reports
          path: build/reports/browser-uat/
          if-no-files-found: error
      - name: Prepare tested deployment artifact
        run: |
          mkdir dist
          cp ./*.html toolkit.css toolkit.js _headers dist/
          cp -R assets vendor offline dist/
      - name: Upload tested deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-site
          path: dist/
          if-no-files-found: error

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Download tested deployment artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cloudflare-site
          path: dist
      - name: Check Cloudflare deployment config
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          project_name="${CLOUDFLARE_PROJECT_NAME:-usefultool}"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "project_name=$project_name" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deploy."
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.config.outputs.project_name }}
