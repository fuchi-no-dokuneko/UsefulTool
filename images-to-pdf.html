<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Images to PDF | UsefulTool</title>
  <link rel="stylesheet" href="toolkit.css">
  <style>.image-row{display:grid;grid-template-columns:72px minmax(140px,1fr) auto;gap:12px;align-items:center}.image-row img{width:72px;height:58px;object-fit:contain;background:#eef2ef}@media(max-width:620px){.image-row{grid-template-columns:58px 1fr}.image-row .row{grid-column:1/-1}}</style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="mark">UT</span><span>Images to PDF</span></a><nav><a href="index.html">Home</a><a href="pdf-merge.html">PDF Merge</a><a href="image-editor.html">Image Editor</a><a href="offline/images-to-pdf.html" download>Download HTML</a></nav></header>
  <section class="page-head"><h1>Combine Images into PDF</h1><p>Arrange local images, choose page sizing and JPEG compression, then create a multi-page PDF with pdf-lib.</p></section>
  <main class="tool-shell">
    <section class="controls stack">
      <label>Add image files<input id="imageInput" type="file" accept="image/*" multiple></label>
      <label>Page size<select id="pageSize"><option value="a4">A4</option><option value="letter">US Letter</option><option value="image">Match each image</option></select></label>
      <label>Orientation<select id="orientation"><option value="auto">Auto from image</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
      <label>Margin (points)<input id="margin" type="number" min="0" max="144" value="24"></label>
      <label>Image DPI for matched pages<input id="dpi" type="number" min="36" max="600" value="144"></label>
      <label>JPEG quality <span id="qualityLabel">0.85</span><input id="quality" type="range" min="0.2" max="1" step="0.05" value="0.85"></label>
      <label class="check"><input id="caption" type="checkbox"> Print filename caption</label>
      <button class="primary" id="buildButton" type="button">Create PDF</button>
      <button class="danger" id="clearButton" type="button">Clear images</button>
      <div class="status" id="status">Add one or more images.</div>
    </section>
    <section class="workspace stack"><h2>Page order</h2><div class="stack" id="imageList"></div></section>
  </main>
  <footer>Images are decoded and embedded locally.</footer>
  <script src="toolkit.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="assets/pages/images-to-pdf.js"></script>
</body>
</html>
