<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>UsefulTool Unit Converter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201b;
      --muted: #5e6962;
      --line: #d7ded8;
      --paper: #f7faf7;
      --panel: #ffffff;
      --green: #0d6b4f;
      --teal: #137083;
      --gold: #a36a00;
      --red: #9b2f2f;
      --shadow: 0 14px 32px rgba(18, 31, 25, .10);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e7f0eb;
      --muted: #a8b8b0;
      --line: #34443b;
      --paper: #101614;
      --panel: #18211d;
      --green: #43bd92;
      --teal: #54bdd0;
      --gold: #e7bd5d;
      --red: #f08b84;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px clamp(14px, 4vw, 34px);
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand, nav a {
      color: inherit;
      text-decoration: none;
      font-weight: 750;
    }
    .brand { display: flex; gap: 10px; align-items: center; }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--green), var(--teal));
      color: #fff;
      font-size: 13px;
    }
    nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    nav a, .button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .theme-toggle {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 8px 11px;
      color: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .button:hover, nav a:hover { border-color: var(--green); }
    .primary { color: #fff; background: var(--green); border-color: var(--green); }
    :root[data-theme="dark"] .topbar,
    :root[data-theme="dark"] nav a,
    :root[data-theme="dark"] .button,
    :root[data-theme="dark"] .theme-toggle,
    :root[data-theme="dark"] .panel,
    :root[data-theme="dark"] .intro,
    :root[data-theme="dark"] .result,
    :root[data-theme="dark"] .formula,
    :root[data-theme="dark"] .favorite {
      background: var(--panel);
      border-color: var(--line);
      color: var(--ink);
      box-shadow: none;
    }
    :root[data-theme="dark"] input,
    :root[data-theme="dark"] textarea,
    :root[data-theme="dark"] select {
      background: #101614;
      border-color: var(--line);
      color: var(--ink);
    }
    :root[data-theme="dark"] .primary { background: var(--green); border-color: var(--green); color: #06110d; }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(16px, 4vw, 34px);
      display: grid;
      grid-template-columns: minmax(310px, 400px) minmax(0, 1fr);
      gap: clamp(16px, 3vw, 28px);
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .intro { padding: 18px; border-bottom: 1px solid var(--line); background: #fbfdfb; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    .lead { margin: 0; color: var(--muted); }
    .controls, .results { padding: 18px; display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 750; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      color: var(--ink);
    }
    input {
      font-size: 22px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .result-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 0;
    }
    h2 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .cards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      display: grid;
      gap: 6px;
      min-height: 94px;
      background: #fff;
    }
    .unit-name { color: var(--muted); font-size: 13px; font-weight: 750; }
    .unit-value {
      font-size: 22px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .formula {
      border-top: 1px solid var(--line);
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 840px) {
      .topbar { align-items: flex-start; flex-direction: column; position: static; }
      nav { justify-content: flex-start; }
      main { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark">UT</span><span>Unit Converter</span></a>
    <nav aria-label="Tool navigation">
      <a href="index.html">Home</a>
      <a href="image-converter.html">Image Tool</a>
      <a href="calculator.html">Calculator</a>
      <a href="metadata-lab.html">Metadata</a>
      <a href="offline/unit-converter.html" download>Download HTML</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <div class="intro">
        <h1>Unit Converter</h1>
        <p class="lead">Fast offline conversions for common engineering, daily-use, and digital units.</p>
      </div>
      <div class="controls">
        <label>Category
          <select id="category"></select>
        </label>
        <label>Value
          <input id="value" inputmode="decimal" value="1" autocomplete="off" spellcheck="false">
        </label>
        <div class="row">
          <label>From
            <select id="fromUnit"></select>
          </label>
          <label>To
            <select id="toUnit"></select>
          </label>
        </div>
        <button class="button primary" id="swapButton" type="button">Swap</button>
        <div class="quick" id="quickButtons"></div>
      </div>
    </section>

    <section class="panel">
      <div class="result-head">
        <div>
          <h2 id="mainResult">1</h2>
          <p class="lead" id="resultLabel">Select units to convert.</p>
        </div>
        <button class="button" id="sourceButton" type="button">View Source</button>
      </div>
      <div class="results">
        <ul class="cards" id="cards"></ul>
      </div>
      <div class="formula" id="formula">All math runs in this page only.</div>
    </section>
  </main>

  <script src="toolkit.js"></script>
  <script src="assets/pages/unit-converter.js"></script>
</body>
</html>
