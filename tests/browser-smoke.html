    function loaded(frame) {
      return new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    }

    function reloaded(frame) {
      return new Promise((resolve) => {
        frame.addEventListener("load", resolve, { once: true });
        frame.contentWindow.location.reload();
      });
    }

    function bytesFromBase64(value) {
      const raw = atob(value);
      return Uint8Array.from(raw, (character) => character.charCodeAt(0));
    }

    function concat(parts) {
      const length = parts.reduce((total, part) => total + part.length, 0);
      const output = new Uint8Array(length);
      let offset = 0;
      for (const part of parts) {
        output.set(part, offset);
        offset += part.length;
      }
      return output;
    }

    function u32be(value) {
      return new Uint8Array([(value >>> 24) & 255, (value >>> 16) & 255, (value >>> 8) & 255, value & 255]);
    }

    function u32le(value) {
      return new Uint8Array([value & 255, (value >>> 8) & 255, (value >>> 16) & 255, (value >>> 24) & 255]);
    }

    function pngChunk(type, payload) {
      const name = new TextEncoder().encode(type);
      return concat([u32be(payload.length), name, payload, new Uint8Array(4)]);
    }

    function pngFixture(tiff) {
      const signature = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      const ihdr = concat([u32be(1), u32be(1), new Uint8Array([8, 2, 0, 0, 0])]);
      const text = new TextEncoder().encode("Comment\0api_key=TOPSECRET");
      return concat([signature, pngChunk("IHDR", ihdr), pngChunk("tEXt", text), pngChunk("eXIf", tiff), pngChunk("IEND", new Uint8Array())]);
    }

    function webpFixture(tiff) {
      const encoder = new TextEncoder();
      const padding = tiff.length % 2 ? new Uint8Array([0]) : new Uint8Array();
      const chunk = concat([encoder.encode("EXIF"), u32le(tiff.length), tiff, padding]);
      return concat([encoder.encode("RIFF"), u32le(4 + chunk.length), encoder.encode("WEBP"), chunk]);
    }

    function webpChunk(type, payload) {
      const padding = payload.length % 2 ? new Uint8Array([0]) : new Uint8Array();
      return concat([new TextEncoder().encode(type), u32le(payload.length), payload, padding]);
    }

    async function imageFile(name = "fixture.png", type = "image/png", width = 8, height = 6) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.fillStyle = "#d7263d";
      context.fillRect(2, 1, Math.max(1, width - 4), Math.max(1, height - 2));
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, type, 0.9));
      return new File([blob], name, { type });
    }

    function setFiles(input, files) {
      const transfer = new DataTransfer();
      files.forEach((file) => transfer.items.add(file));
      input.files = transfer.files;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    async function waitUntil(predicate, message) {
      for (let attempt = 0; attempt < 100; attempt += 1) {
        if (predicate()) return;
        await new Promise((resolve) => setTimeout(resolve, 20));
      }
      throw new Error("Timed out: " + message);
    }

    function throws(fn) {
      try { fn(); return false; } catch (_) { return true; }
    }

    async function rejects(promise) {
      try { await promise; return false; } catch (_) { return true; }
    }

    async function deflateBytes(bytes) {
      const writerInput = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
      return new Uint8Array(await new Response(writerInput).arrayBuffer());
    }

    function jpegSegment(marker, payload) {
      const length = payload.length + 2;
      return concat([new Uint8Array([255, marker, (length >>> 8) & 255, length & 255]), payload]);

      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("GIF comment decoded", output.includes("secret"));

      const avif = concat([u32be(12), new TextEncoder().encode("ftypavif")]);
      const mp4 = concat([u32be(12), new TextEncoder().encode("ftypisom")]);
      const webm = new Uint8Array([0x1a, 0x45, 0xdf, 0xa3]);
      const bmp = new TextEncoder().encode("BM");
      check("format signatures",
        metadata.detectFormat(pngFixture(tiff), { name: "x.bin" }) === "PNG" &&
        metadata.detectFormat(webpFixture(tiff), { name: "x.bin" }) === "WebP" &&
        metadata.detectFormat(tiff, { name: "x.bin" }) === "TIFF" &&
        metadata.detectFormat(gifComment, { name: "x.bin" }) === "GIF" &&
        metadata.detectFormat(bmp, { name: "x.bmp" }) === "BMP" &&
        metadata.detectFormat(avif, { name: "x.bin" }) === "AVIF" &&
        metadata.detectFormat(mp4, { name: "x.bin" }) === "MP4" &&
        metadata.detectFormat(webm, { name: "x.bin" }) === "WebM");

      const jpegReal = new Uint8Array(await jpegFile.arrayBuffer());
      metadata.resetView();
      const injectedJpeg = metadata.injectJpegComment(jpegReal, "author=user@example.com token=TOPSECRET");
      metadata.inspectJpeg(injectedJpeg);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("JPEG injection parses with privacy findings", output.includes("JPEG comment") && output.includes("Email address"));

      const realPngBytes = new Uint8Array(await pngFile.arrayBuffer());
      metadata.resetView();
      const injectedPng = metadata.injectPngText(realPngBytes, "location=35.6,139.7 password=TOPSECRET");
      await metadata.inspectPng(injectedPng);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("PNG injection parses", output.includes("UsefulTool") && output.includes("Possible secret"));

      const bmpFixture = new Uint8Array(138);
      bmpFixture.set(new TextEncoder().encode("BM"));
      const bmpView = new DataView(bmpFixture.buffer);
      bmpView.setUint32(14, 124, true);
      bmpView.setInt32(18, 4, true);
      bmpView.setInt32(22, -3, true);
      metadata.resetView();
      metadata.inspectBmp(bmpFixture);
      check("BMP dimensions decoded", metadataWindow.document.getElementById("facts").textContent.includes("4 x 3"));

      const encoder = new TextEncoder();
      const ftyp = metadata.makeMp4Box("ftyp", encoder.encode("isom0000"));
      const nested = metadata.makeMp4Box("moov", metadata.makeMp4Box("udta", encoder.encode("location +35.6+139.7 author user@example.com")));
      const mp4Fixture = concat([ftyp, nested, metadata.makeMp4Box("free", encoder.encode("comment password=TOPSECRET"))]);
      metadata.resetView();
      metadata.inspectMp4(mp4Fixture);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("MP4 boxes and privacy decoded", output.includes("metadata-bearing box") && output.includes("Location metadata") && output.includes("Possible secret"));
      check("MP4 metadata strip keeps ftyp", metadata.detectFormat(metadata.stripMp4Ranges(mp4Fixture, 0, mp4Fixture.length, "root"), { name: "x.mp4" }) === "MP4");
      check("MP4 injection adds free box", metadata.injectMp4Free(ftyp, "hello").length > ftyp.length);

      metadata.resetView();
      metadata.inspectWebm(concat([webm, encoder.encode("webm TITLE Demo ARTIST user@example.com LOCATION 35.6 COMMENT password=TOPSECRET") ]));
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("WebM tags decoded", output.includes("WebM tag") && output.includes("Possible secret"));

      const compressedText = await deflateBytes(encoder.encode("<rdf:RDF password=TOPSECRET>compressed XMP</rdf:RDF>"));
      const advancedPng = concat([
        new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]),
        pngChunk("IHDR", concat([u32be(2), u32be(3), new Uint8Array([8, 6, 0, 0, 0])])),
        pngChunk("zTXt", concat([encoder.encode("XML:com.adobe.xmp"), new Uint8Array([0, 0]), compressedText])),
        pngChunk("iTXt", concat([encoder.encode("XML:com.adobe.xmp"), new Uint8Array([0, 1, 0, 0, 0]), compressedText])),
        pngChunk("iCCP", concat([encoder.encode("Profile"), new Uint8Array([0, 0]), await deflateBytes(icc)])),
        pngChunk("pHYs", concat([u32be(3780), u32be(3780), new Uint8Array([1])])),
        pngChunk("tIME", new Uint8Array([7, 234, 8, 23, 12, 34, 56])),
        pngChunk("gAMA", u32be(45455)),
        pngChunk("vpAg", new Uint8Array([1, 2, 3])),
        pngChunk("IEND", new Uint8Array())
      ]);
      metadata.resetView();
      await metadata.inspectPng(advancedPng);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("PNG compressed metadata branches", output.includes("PNG zTXt") && output.includes("PNG iTXt") && output.includes("Physical pixel density") && output.includes("Last modification time") && output.includes("PNG iCCP"));

      const webpPayload = concat([
        webpChunk("VP8X", new Uint8Array([12, 0, 0, 0, 1, 0, 0, 2, 0, 0])),
        webpChunk("ICCP", icc),
        webpChunk("XMP ", encoder.encode("<rdf:RDF><token>password=TOPSECRET</token></rdf:RDF>"))
      ]);
      const webpChunks = concat([encoder.encode("RIFF"), u32le(4 + webpPayload.length), encoder.encode("WEBP"), webpPayload]);
      metadata.resetView();
      metadata.inspectWebp(webpChunks);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("WebP extended metadata branches", output.includes("VP8X") && output.includes("WebP ICCP") && output.includes("WebP XMP"));

      const xmpPayload = encoder.encode("http://ns.adobe.com/xap/1.0/\0<x:xmpmeta><rdf:RDF><rdf:Description creator='user@example.com'/></rdf:RDF></x:xmpmeta>");
      const iccPayload = concat([encoder.encode("ICC_PROFILE\0"), new Uint8Array([1, 1]), icc]);
      const iptcPayload = concat([new Uint8Array([0x1c, 2, 80, 0, 5]), encoder.encode("Alice")]);
      const sofPayload = new Uint8Array([8, 0, 3, 0, 4]);
      const advancedJpeg = concat([
        new Uint8Array([255, 216]),
        jpegSegment(225, xmpPayload),
        jpegSegment(226, iccPayload),
        jpegSegment(237, iptcPayload),
        jpegSegment(192, sofPayload),
        jpegSegment(224, encoder.encode("JFIF-extra")),
        new Uint8Array([255, 217])
      ]);
      metadata.resetView();
      metadata.inspectJpeg(advancedJpeg);
      metadata.finalizePrivacy();
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("JPEG APP metadata branches", output.includes("JPEG APP1") && output.includes("JPEG APP2") && output.includes("JPEG APP13") && metadataWindow.document.getElementById("facts").textContent.includes("4 x 3"));

      metadata.resetView();
      metadata.inspectExif(new Uint8Array(), 0, "short");
      metadata.inspectExif(new Uint8Array(12), 0, "bad-order");
      const badMagic = new Uint8Array([73, 73, 0, 0, 0, 0, 0, 0]);
      metadata.inspectExif(badMagic, 0, "bad-magic");
      metadata.inspectIcc(new Uint8Array(8), "short-profile");
      metadata.inspectIptc(new Uint8Array([1, 2, 3, 4, 5]), 0, 5, "empty IPTC");
      metadata.inspectXmpText("<rdf:RDF><title>Leaf text</title><empty /></rdf:RDF>", "leaf XMP");
      output = metadataWindow.document.getElementById("metadataList").textContent;
      check("metadata malformed inputs are explicit", output.includes("Invalid TIFF header offset") && output.includes("Invalid TIFF byte order") && output.includes("Unsupported TIFF magic") && output.includes("header too short") && output.includes("No decodable IIM"));

      const gifBranches = concat([
        encoder.encode("GIF89a"), new Uint8Array([1, 0, 1, 0, 0, 0, 0]),
        new Uint8Array([0x21, 0xff, 3]), encoder.encode("APP"), new Uint8Array([2, 1, 2, 0]),
        new Uint8Array([0x21, 0xf9, 4, 0, 0, 0, 0, 0]),
        new Uint8Array([0x2c, 0, 0, 0, 0, 1, 0, 1, 0, 0, 2, 1, 0, 0x3b])
      ]);
      metadata.resetView();
      metadata.inspectGif(gifBranches);
      check("GIF application and image branches", metadataWindow.document.getElementById("metadataList").textContent.includes("GIF application"));

      const unknownWebpPayload = webpChunk("ANIM", new Uint8Array([1, 2, 3, 4]));
      metadata.resetView();
      metadata.inspectWebp(concat([encoder.encode("RIFF"), u32le(4 + unknownWebpPayload.length), encoder.encode("WEBP"), unknownWebpPayload]));
      check("WebP unknown chunk visible", metadataWindow.document.getElementById("metadataList").textContent.includes("WebP chunk"));

      check("metadata extension fallbacks", metadata.detectFormat(new Uint8Array([1]), { name: "x.heic" }) === "HEIF" && metadata.detectFormat(new Uint8Array([1]), { name: "x.avif" }) === "AVIF" && metadata.detectFormat(new Uint8Array([1]), { name: "x.bin" }) === "Unknown");

      async function loadMetadataFile(file) {
        metadata.resetView();
        setFiles(metadataWindow.document.getElementById("fileInput"), [file]);
        await waitUntil(() => metadataWindow.document.getElementById("facts").textContent.includes(file.name), "metadata upload " + file.name);
      }

      const metadataFiles = [
        jpegFile,
        pngFile,
        new File([webpFixture(tiff)], "fixture.webp", { type: "image/webp" }),
        new File([gifComment], "fixture.gif", { type: "image/gif" }),
        new File([tiff], "fixture.tiff", { type: "image/tiff" }),
        new File([bmpFixture], "fixture.bmp", { type: "image/bmp" }),
        new File([concat([u32be(12), encoder.encode("ftypavif")])], "fixture.avif", { type: "image/avif" }),
        new File([concat([u32be(12), encoder.encode("ftypheic")])], "fixture.heic", { type: "image/heic" }),
        new File([mp4Fixture], "fixture.mp4", { type: "video/mp4" }),
        new File([concat([webm, encoder.encode("webm TITLE fixture")])], "fixture.webm", { type: "video/webm" }),
        new File(["unknown"], "fixture.bin", { type: "application/octet-stream" })
      ];
      for (const file of metadataFiles) await loadMetadataFile(file);

      await loadMetadataFile(jpegFile);
      check("JPEG pixel dimensions keep width-height orientation", metadataWindow.document.getElementById("facts").textContent.includes("9 x 5"));
      metadataWindow.document.getElementById("injectMode").click();
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => !metadataWindow.document.getElementById("downloadButton").disabled, "JPEG metadata injection");
      metadataWindow.document.getElementById("eraseMode").click();
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => /metadata erased/i.test(metadataWindow.document.getElementById("metadataList").textContent), "JPEG metadata erase");

      await loadMetadataFile(new File([mp4Fixture], "actions.mp4", { type: "video/mp4" }));
      metadataWindow.document.getElementById("eraseMode").click();
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => /MP4 metadata stripped/.test(metadataWindow.document.getElementById("metadataList").textContent), "MP4 metadata erase");
      metadataWindow.document.getElementById("injectMode").click();
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => /MP4 free box injected/.test(metadataWindow.document.getElementById("metadataList").textContent), "MP4 metadata injection");

      await loadMetadataFile(new File([webm], "unsupported.webm", { type: "video/webm" }));
      metadataWindow.document.getElementById("eraseMode").click();
      metadataWindow.document.getElementById("runButton").click();
      metadataWindow.document.getElementById("injectMode").click();
      metadataWindow.document.getElementById("runButton").click();
      check("unsupported metadata rewrites remain explicit", metadataWindow.document.getElementById("metadataList").textContent.includes("Inject not available"));

      metadata.resetView();
      setFiles(metadataWindow.document.getElementById("fileInput"), [pngFile]);
      await waitUntil(() => metadataWindow.document.getElementById("facts").textContent.includes("fixture.png"), "metadata real file inspect");
      metadataWindow.document.getElementById("eraseMode").click();
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => !metadataWindow.document.getElementById("downloadButton").disabled, "metadata erase output");
      metadataWindow.document.getElementById("downloadButton").click();
      metadataWindow.document.getElementById("injectMode").click();
      metadataWindow.document.getElementById("note").value = "new metadata note";
      metadataWindow.document.getElementById("runButton").click();
      await waitUntil(() => /injected/i.test(metadataWindow.document.getElementById("metadataList").textContent), "metadata inject output");
      metadataWindow.document.getElementById("base64Input").value = "data:image/png;base64," + btoa(String.fromCharCode(...realPngBytes));
      metadataWindow.document.getElementById("decodeBase64Button").click();
      await waitUntil(() => metadataWindow.document.getElementById("facts").textContent.includes("PNG"), "metadata Base64 inspect");

      const passed = checks.every((item) => item.pass);
      document.getElementById("result").textContent = (passed ? "PASS" : "FAIL") + "\n" +
        checks.map((item) => (item.pass ? "PASS " : "FAIL ") + item.name + (item.detail ? " | " + item.detail : "")).join("\n");
      document.title = passed ? "PASS" : "FAIL";
    })().catch((error) => {
      document.getElementById("result").textContent = "FAIL\n" + error.stack;
      document.title = "FAIL";
    });
  </script>
</body>
</html>
